[project]
name = "ddl-builder"
version = "0.1.0"
description = "Generate PostgreSQL DDL from YAML data model definitions"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Simon Goring", email = "simon.goring@ubc.ca" }]
maintainers = [{ name = "Simon Goring", email = "simon.goring@ubc.ca" }]
requires-python = ">=3.12"
dependencies = [
    "data-model",
    "griffe-fieldz>=0.5.0",
    "pathlib>=1.0.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pytest-html>=4.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

keywords = [
    "postgresql",
    "ddl",
    "sql",
    "yaml",
    "database",
    "schema",
    "code-generation",
]

[project.scripts]
ddl-builder = "ddl_builder:main"

[project.urls]
Homepage = "https://github.com/UBC-DERC/ddl_builder"
Documentation = "https://ubc-derc.github.io/ddl_builder"
Repository = "https://github.com/UBC-DERC/ddl_builder.git"
Issues = "https://github.com/UBC-DERC/ddl_builder/issues"
Changelog = "https://github.com/UBC-DERC/ddl_builder/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "pytest>=9.0.3",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
generate_report_on_test = true
addopts = "--html=docs/test_report.html"

[tool.uv.sources]
data-model = { git = "https://github.com/UBC-DERC/data_model", branch = "develop" }
