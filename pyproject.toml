[project]
name = "ddl-builder"
version = "0.1.0"
description = "Generate PostgreSQL DDL from YAML data model definitions"
readme = "README.md"
license = "MIT"
authors = [{ name = "Simon Goring", email = "simon.goring@ubc.ca" }]
maintainers = [{ name = "Simon Goring", email = "simon.goring@ubc.ca" }]
requires-python = ">=3.12"
dependencies = [
    "data-model",
    "griffe-fieldz>=0.5.0",
    "mkdocs>=1.6.1",
    "mkdocs-include-dir-to-nav>=1.2.0",
    "mkdocs-material>=9.7.7",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.6",
    "pathlib>=1.0.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pytest-html>=4.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

keywords = [
    "postgresql",
    "ddl",
    "sql",
    "yaml",
    "database",
    "schema",
    "code-generation",
]

[project.scripts]
ddl-builder = "ddl_builder:main"

[project.urls]
Homepage = "https://github.com/UBC-DERC/ddl_builder"
Documentation = "https://ubc-derc.github.io/ddl_builder"
Repository = "https://github.com/UBC-DERC/ddl_builder.git"
Issues = "https://github.com/UBC-DERC/ddl_builder/issues"
Changelog = "https://github.com/UBC-DERC/ddl_builder/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
generate_report_on_test = true
addopts = "--html=docs/test_report.html --cov=ddl_builder --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ddl_builder"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80

[tool.uv.sources]
data-model = { git = "https://github.com/UBC-DERC/data_model", branch = "develop" }
