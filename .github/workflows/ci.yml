name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ddlb
          POSTGRES_PASSWORD: ddlb
          POSTGRES_DB: ddlb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ddlb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ddlb
      POSTGRES_PASSWORD: ddlb
      DDLB_REQUIRE_POSTGRES: "1"
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=ddl_builder --cov-report=xml
      - uses: codecov/codecov-action@v4
