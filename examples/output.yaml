    comment: A table for institutions and organizations. This table is modeled after
      the [Research Organization Registry](https://ror.org/) and is intended to link
      to collaboration institutions, manufacturers, suppliers and research or operational
      dairy farms.
    constraints:
    - columns:
      - institutionid
      comment: Primary key for the institutions table (expects to be unique)
      ddl: PRIMARY KEY(institutionid)
      name: institutionid_pk
      references: null
      type: PRIMARY KEY
    - columns:
      - superceedingrecord
      comment: Allows for institutions to be renamed, or get switched over time.
      ddl: FOREIGN KEY (superceedingrecord) REFERENCES institutions(institutionid)
      name: institution_superceeding_fk
      references:
        columns:
        - institutionid
        schema: dairy
        table: institutions
      type: REFERENCES
    indexes: []
    name: institutions
    schema: dairy
