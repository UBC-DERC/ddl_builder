      ddl: FOREIGN KEY (supplierid) REFERENCES institutions(institutionid) ON UPDATE
        CASCADE
      name: supplier_fkey
      references:
        columns:
        - institutionid
        schema: dairy
        table: institutions
      type: REFERENCES
    indexes: []
    name: instruments
    schema: dairy
    type: BASE TABLE
