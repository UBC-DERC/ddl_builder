      name: individualid
      nullable: true
      type: uuid7
    - comment: Full name of an individual, in written order (i.e., as they would write
        their names)
      name: fullname
      nullable: true
      type: text
    - comment: This is the last name, family name, or singular name that would lead
        in a journal citation, or when the individual is formally addressed.
      name: formalname
      nullable: true
      type: text
    - comment: For individuals who have a preferred name that is not the same as their
