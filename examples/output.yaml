comment: No comment provided.
encoding: UTF8
extensions:
- postgis
- pg_stat_monitor
- pg_trgm
locale: en_CA
name: dairymodel
owner: null
schemas:
- comment: The main dairy schema, with all data structures used for the farm.
  name: dairy
  tables:
  - columns:
    - comment: This is the unique identifier given to the cow by the Canadian Government.
      name: cadid
      nullable: true
      type: text
    - comment: We clearly identify the scheme from which the cow ID is coming from.
        It is implied  that this is the Canadian data scheme, but if this data is
        used in synthesis work  it is important to identify the source.
      name: cowschemeid
      nullable: true
      type: text
    - comment: Within the UBC dairy the cows are given ear tags with the numbering
        scheme YNNN where Y is the last number of the year (6 for 2026) and NNN is
        the birth order of the cow in a given year.
      name: localcowid
      nullable: true
      type: integer
    - comment: We record both male and female births in this database.
      name: gender
      nullable: true
      type: nchar(1)
    - comment: The weight of the cow at birth.
      name: birthweight
      nullable: true
      type: integer
    - comment: The cadid identifier for the dam. Should generally be constrained to
        be a valid identifer.
      name: damid
      nullable: true
      type: text
    - comment: My guess is that this is actually a pointer to another table, with
        some extra information.
      name: sireid
      nullable: true
      type: text
    - comment: The date this entry was created. This field is used for the purposes
        of tracking changes across the database, and supporting reproducibility of
        data and data models, by allowing users to "roll back" or search for the impacts
        of new changes or data additions.
      name: datecreated
      nullable: true
      type: datetime
    - comment: The date of the most recent record modification. This column does not
        identify how the record was changed, although this should be a central element
        of the data model. At present we are implementing the toolset, and providing
        the opportunity to see that a record was modified, not neccessarily how that
        record was modified.
      name: datemodified
      nullable: true
      type: datetime
    comment: The primary table for cow-related identification. This table should tie
      to any information about cows, their locations, movement, treatments and, ultimately,
      datasets produced using the cows as primary data elements.
    constraints:
    - columns:
      - cadid
      - cowschemeid
      comment: 'The PRIMARY KEY for this table is the unique set of the Canadian ID
        and the scheme type. In our case all of the identifiers should have '
      ddl: PRIMARY KEY (cadid, cowschemeid)
      name: cowuniqueid
      references: null
      type: PRIMARY KEY
    - columns:
      - damid
      comment: A constraint to ensure that the dam ID is a valid ID based on the Canadian
        government ID scheme.
      ddl: CHECK (damid ~* '^.*$')
      name: damidvalid
      references: null
      type: CHECK
    indexes: []
    name: cows
    schema: dairy
    type: BASE TABLE
  - columns:
    - comment: A unique internal indentifier for the dataset. This dataset id is used
        to link to records and objects internally within the database. We use a uuid7
        data type for these records so that the identifier can be located across all
        data tables (as opposed to an integer, which may be duplicated across multiple
        tables).
      name: datasetid
      nullable: true
      type: uuid7
    - comment: The external identifier for the dataset object. This may be a DOI,  an
        ARK or a different data object. Currently the choice is simply  one of the
        entries in the `externaldatabases` table, but this may  be limited to a subset
        in the future.
      name: identifier
      nullable: true
      type: text
    - comment: A pointer to the `externaldatabase` table. It may be worth adding a
        constraint that the `identifier` and the `urlmask` should form a valid URL.
        In this case we should do some proper error/assertion responses to make sure
        we're getting things right.
      name: externaldatabaseid
      nullable: true
      type: uuid7
    - comment: The date this entry was created. This field is used for the purposes
        of tracking changes across the database, and supporting reproducibility of
        data and data models, by allowing users to "roll back" or search for the impacts
        of new changes or data additions.
      name: datecreated
      nullable: true
      type: datetime
    - comment: The date of the most recent record modification. This column does not
        identify how the record was changed, although this should be a central element
        of the data model. At present we are implementing the toolset, and providing
        the opportunity to see that a record was modified, not neccessarily how that
        record was modified.
      name: datemodified
      nullable: true
      type: datetime
    comment: Links datasets to URLs/DOIs/ARKs for external data resources.
    constraints:
    - columns: []
      comment: Primary key to ensure unique entries. Joint key, since we need all
        the information to provide a unique key.
      ddl: PRIMARY KEY (datasetid, identifier, externaldatabaseid)
      name: datasetidentifiers_pk
      references: null
      type: PRIMARY KEY
    - columns: []
      comment: A foreign key to point to the dataset id.
      ddl: FOREIGN KEY (datasetid) REFERENCES datasets(datasetid) ON UPDATE CASCADE
        ON DELETE CASCADE
      name: datasetidentifiers_dsid_fk
      references:
        columns:
        - datasetid
        schema: dairy
        table: datasets
      type: REFERENCES
    - columns: []
      comment: Foreign key reference to external databases or resources.
      ddl: FOREIGN KEY (externaldatabaseid) REFERENCES externaldatabases(externaldatabaseid)
        ON UPDATE CASCADE ON DELETE CASCADE
      name: datasetidentifiers_externaldbid_fk
      references:
        columns:
        - databaseid
        schema: dairy
        table: externaldatabases
      type: REFERENCES
    indexes: []
    name: datasetidentifiers
    schema: dairy
    type: BASE TABLE
  - columns:
    - comment: References the uuid for the dataset metadata stored in the database.
      name: datasetid
      nullable: true
      type: uuid7
    - comment: A pointer to the publications table.
      name: publicationid
      nullable: true
      type: uuid7
    comment: Links DERC related datasets to publications in the literature.
    constraints:
    - columns: []
      comment: The foreign key referencing the datasets table in the database.
      ddl: FOREIGN KEY (datasetid) REFERENCES datasets(datasetid) ON UPDATE CASCADE
        ON DELETE CASCADE
      name: datasetpublications_datasetid_fk
      references:
        columns:
        - datasetid
        schema: dairy
        table: datasets
      type: REFERENCES
    - columns: []
      comment: The foreign key referencing the publications table in the database.
      ddl: FOREIGN KEY (publicationid) REFERENCES publication(publicationid) ON UPDATE
        CASCADE ON DELETE CASCADE
      name: datasetpublications_publicationid_fk
      references:
        columns:
        - publicationid
        schema: dairy
        table: publications
      type: REFERENCES
    - columns:
      - publicationid
      - datasetid
      comment: The Primary Key here is the joint datasetid/publicationid key. It shouldn't
        be repeated.
      ddl: PRIMARY KEY (datasetid, publicationid)
      name: datasetpublications_joint_pk
      references: null
      type: PRIMARY KEY
    indexes: []
    name: datasetpublications
    schema: dairy
    type: BASE TABLE
  - columns:
    - comment: A unique internal indentifier for the dataset. This dataset id is used
