        the opportunity to see that a record was modified, not neccessarily how that
        record was modified.
      name: datemodified
      nullable: true
      type: datetime
    comment: A table to manage and record pointers to various external resources.
      These resources include data management tools such as DOIs and ARKs, product
      identifiers such as UPC codes,  and other external references such as WikiData,
      or others.
    constraints: []
    indexes: []
    name: externaldatabases
    schema: dairy
    type: BASE TABLE
  - columns:
    - comment: An internal and unique identifier for an individual to support identification
