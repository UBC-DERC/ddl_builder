    comment: A table for managing scientific and technical instruments used within
      the research system. This table is intended to help with connecting  measurements
      to documentation and workflow management. The design of this table and its associated
      foreign key links is based on the [RDA PIDINST v1.0](https://zenodo.org/records/6396467#.YkQxzRBBwlw).
    constraints:
    - columns:
      - instrumentid
      comment: The PRIMARY KEY for this table is a UUID7, which is unordered and globally
        unique. This is not the same as the UPC or serial number, and should be used
        only for internal reference.
      ddl: PRIMARY KEY (instrumentid)
      name: instrument_pkey
      references: null
      type: PRIMARY KEY
    - columns:
      - instrumentid
      comment: In the event an instrument is re-defined somehow -- when a value is
        overwritten -- this hierarchical key will point to the new information.
      ddl: FOREIGN KEY (superceedingrecordid) REFERENCES instruments(instrumentid)
        ON UPDATE CASCADE ON DELETE CASCADE
      name: superceeding_fkey
      references:
        columns:
        - instrumentid
        schema: dairy
        table: instruments
      type: REFERENCES
    - columns:
      - manufacturerid
      comment: No comment provided.
      ddl: FOREIGN KEY (manufacturerid) REFERENCES institutions(institutionid) ON
        UPDATE CASCADE
      name: manufacturer_fkey
      references:
        columns:
        - institutionid
        schema: dairy
        table: institutions
      type: REFERENCES
    - columns:
      - supplierid
