      name: datasetid
      nullable: true
      type: uuid7
    - comment: A short name for the dataset used in summarizing its content.
      name: datasetname
      nullable: true
      type: text
    - comment: A longer form description of the dataset.
      name: datasetdescription
      nullable: true
      type: text
    - comment: The date this entry was created. This field is used for the purposes
