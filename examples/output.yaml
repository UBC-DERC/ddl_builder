    comment: A table to document datasets associated with the UBC Dairy Research Farm.
      Modeled largely on the work of [Science On Schema](https://github.com/ESIPFed/science-on-schema.org/blob/main/guides/Dataset.md)
    constraints:
    - columns:
      - datasetid
      comment: No comment provided.
      ddl: PRIMARY KEY (datasetid)
      name: datasets_pk
      references: null
      type: PRIMARY KEY
    indexes: []
    name: datasets
    schema: dairy
    type: BASE TABLE
  - columns:
    - comment: A unique internal identifier for an external database reference.
      name: databaseid
      nullable: true
      type: uuid7
    - comment: The name of the external database or data resource.
      name: externaldatabase
      nullable: true
      type: text
    - comment: A web address for this resource, a primary location.
      name: url
      nullable: true
      type: url
    - comment: The url mask is intended to show how the identifers should be used.  The
        mask will be based on the resource itself. For example, ORCID indicates  that
        its identifiers should be written as `https://orcid.org/0000-0000-0000-0000`,  in
        which case the URL mask should be `{identifier}` such that replacing the  identifier
        produces a valid URL. Thus, for a DOI, where the DOI itself is written `10.0000/0000000`,
        the mask will be `https://doi.org/{identifier}`.
      name: urlmask
      nullable: true
      type: url
    - comment: The date this entry was created. This field is used for the purposes
        of tracking changes across the database, and supporting reproducibility of
        data and data models, by allowing users to "roll back" or search for the impacts
        of new changes or data additions.
      name: datecreated
      nullable: true
