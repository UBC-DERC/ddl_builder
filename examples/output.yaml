    - comment: A unique internal identifer for a publication in the database.
      name: publicationid
      nullable: true
      type: uuid7
    - comment: The article, or publication title.
      name: title
      nullable: true
      type: text
    - comment: A longer form description of the dataset.
      name: abstract
      nullable: true
      type: text
    - comment: The date this entry was created. This field is used for the purposes
        of tracking changes across the database, and supporting reproducibility of
        data and data models, by allowing users to "roll back" or search for the impacts
        of new changes or data additions.
      name: datecreated
      nullable: true
      type: datetime
    - comment: The date of the most recent record modification. This column does not
        identify how the record was changed, although this should be a central element
        of the data model. At present we are implementing the toolset, and providing
        the opportunity to see that a record was modified, not neccessarily how that
        record was modified.
      name: datemodified
      nullable: true
      type: datetime
    - comment: A valid BibTeX reference for a publication.
      name: bibtex
      nullable: true
      type: jsonb
    - comment: A datetime object for the beginning of the publication date. We use
        start and end date as a convention to manage uncertainty. In a case where
        only year is known, we assign dates beginning at XXXX-01-01 and an end date
        of XXXX-12-31.
      name: datepublishedstart
      nullable: true
      type: datetime
    - comment: 'A datetime object for the end of the possible publication date. We
        use start and end date as a convention to manage uncertainty. In a case where
        only year is known, we assign dates beginning at XXXX-01-01 and an end date
        of XXXX-12-31. '
      name: datepublishedend
      nullable: true
      type: datetime
    comment: Documenting publication information tied to DERC. May be related to DERC
      researchers, collaborators or associated work. This table is likely to be liberal
      in its inclusion because much of the material will be imported through bulk-import
      processes.
    constraints:
    - columns:
      - publicationid
      comment: No comment provided.
      ddl: PRIMARY KEY (publicationid)
      name: publication_pk
      references: null
      type: PRIMARY KEY
    indexes: []
    name: publications
    schema: dairy
    type: BASE TABLE
- comment: The schema used for application specific tables, views and materialized views.
  name: apps
  tables: []
